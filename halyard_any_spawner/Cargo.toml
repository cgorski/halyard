[package]
name = "halyard_any_spawner"
version = "0.1.0"
publish = ["crates-io"]
authors = ["Greg Johnston"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/cgorski/halyard"
description = "Spawn asynchronous tasks in an executor-independent way."
edition.workspace = true

[dependencies]
futures = { workspace = true, default-features = true }
thiserror = { workspace = true , default-features = true }
tokio = { optional = true, default-features = false, features = [
  "rt",
] , workspace = true }
tracing = { optional = true , workspace = true, default-features = true }
wasm-bindgen-futures = { optional = true , workspace = true, default-features = true }

# to log a dropped task in the browser's console when `tracing` is off
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-sys = { workspace = true, features = ["console"] }

[dev-dependencies]
tokio = { default-features = false, features = [
  "rt",
  "macros",
  "time",
] , workspace = true }
wasm-bindgen-test = { workspace = true, default-features = true }

[features]
tracing = ["dep:tracing"]
tokio = ["dep:tokio"]
wasm-bindgen = ["dep:wasm-bindgen-futures"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-all-features]
denylist = ["tracing"]
max_combination_size = 2
