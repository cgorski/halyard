[package]
name = "halyard"
version = "0.1.0"
publish = ["crates-io"]
authors = ["Greg Johnston"]
license = "MIT"
repository = "https://github.com/cgorski/halyard"
description = "Halyard is a full-stack, isomorphic Rust web framework leveraging fine-grained reactivity to build declarative user interfaces."
readme = "../README.md"
rust-version.workspace = true
edition.workspace = true

[dependencies]
halyard_macro = { workspace = true }
halyard_reactive_graph = { workspace = true, features = ["serde", "hydration"] }
halyard_tachys = { workspace = true }
base64 = { workspace = true, default-features = true }
futures = { workspace = true, default-features = true }
rustc-hash = { workspace = true, default-features = true }
send_wrapper = { workspace = true, default-features = true }
serde = { features = [
  "derive",
  "rc",
], workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
serde_qs = { workspace = true, default-features = true }
slotmap = { workspace = true, default-features = true }
thiserror = { workspace = true, default-features = true }
tracing = { optional = true, workspace = true, default-features = true }
typed-builder = { workspace = true, default-features = true }
typed-builder-macro = { workspace = true, default-features = true }
wasm-bindgen = { workspace = true, default-features = true }
wasm-bindgen-futures = { workspace = true, default-features = true }
wasm_split_helpers = { workspace = true, default-features = true }
js-sys = { workspace = true, default-features = true }
web-sys = { features = [
  "Document",
  "Window",
  "console",
  "Location",
  # portals
  "ShadowRoot",
  "ShadowRootInit",
  "ShadowRootMode",
  # forms (`form::FromFormData`, the router's `<Form/>`)
  "Event",
  "FormData",
  "HtmlButtonElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "SubmitEvent",
  "UrlSearchParams",
  # the router: history and links
  "History",
  "HtmlAnchorElement",
  "MouseEvent",
  "Url",
  # the router: fetching pages and posting forms
  "Headers",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  # meta
  "HtmlLinkElement",
  "HtmlMetaElement",
  "HtmlTitleElement",
], workspace = true, default-features = true }
# config
config = { default-features = false, features = [
  "toml",
  "convert-case",
], workspace = true }
# server (resources)
codee = { features = ["json_serde"], workspace = true, default-features = true }
# meta
html-escape = { workspace = true, default-features = true }
# router
gloo-net = { workspace = true, default-features = true }
percent-encoding = { optional = true, workspace = true, default-features = true }
url = { workspace = true, default-features = true }
# axum integration
axum = { optional = true, default-features = false, features = [
  "matched-path",
], workspace = true }
tokio = { optional = true, default-features = false, workspace = true }
tower = { optional = true, features = [
  "util",
], workspace = true, default-features = true }
tower-http = { optional = true, workspace = true, default-features = true }

# nonces are generated on the server only; the browser reads the one the server rendered
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rand = { optional = true, workspace = true, default-features = true }

[features]
# server-side rendering and hydration share the data the server sends with the page
hydration = ["halyard_reactive_graph/browser"]
# the browser build: hydrates server-rendered pages
hydrate = [
  "halyard_macro/hydrate",
  "hydration",
  "halyard_tachys/hydrate",
  "halyard_reactive_graph/effects",
]
# the server build: renders pages to HTML (also enables the router's and meta's server side)
ssr = ["hydration", "halyard_tachys/ssr", "dep:percent-encoding"]
# the axum integration (`halyard::axum`): a native server on Tokio
axum = [
  "ssr",
  "nonce",
  "dep:axum",
  "dep:tokio",
  "dep:tower",
  "dep:tower-http",
  "axum/default",
  "tokio/fs",
  "tokio/sync",
  "tower-http/fs",
  "tower/util",
  "halyard_reactive_graph/sandboxed-arenas",
]
tracing = [
  "dep:tracing",
  "halyard_reactive_graph/tracing",
  "halyard_tachys/tracing",
  "halyard_macro/tracing",
]
nonce = ["dep:rand"]
islands = ["halyard_macro/islands"]
trace-component-props = ["halyard_macro/trace-component-props"]
delegation = ["halyard_tachys/delegation"]
# the islands router: marks branches, and serializes the keys of keyed lists
islands-router = ["halyard_tachys/mark_branches", "halyard_tachys/islands"]

[dev-dependencies]
tokio = { features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "io-util",
  "net",
  "process",
  "time",
], workspace = true, default-features = true }
tokio-test = { workspace = true, default-features = true }
tempfile = { workspace = true, default-features = true }
temp-env = { features = [
  "async_closure",
], workspace = true, default-features = true }
anyhow = { workspace = true }
axum = { workspace = true, default-features = true }
reqwest = { workspace = true }

# Having an erasure feature rather than normal --cfg erase_components for the proc macro crate is a workaround for this rust issue:
# https://github.com/rust-lang/cargo/issues/4423
# TLDR proc macros will ignore RUSTFLAGS when --target is specified on the cargo command.
# This works around the issue by the non proc-macro crate which does see RUSTFLAGS enabling the replacement feature on the proc-macro crate, which wouldn't.
# This is automatic as long as the halyard crate is depended upon,
# downstream usage should never manually enable this feature.
[target.'cfg(erase_components)'.dependencies]
halyard_macro = { workspace = true, features = ["__internal_erase_components"] }

[package.metadata.cargo-all-features]
denylist = [
  "tracing",
  "trace-component-props",
  "islands",
]
skip_feature_sets = [
  [
    "ssr",
    "hydrate",
  ],
  [
    "axum",
    "hydrate",
  ],
]
max_combination_size = 2

[package.metadata.docs.rs]
features = ["ssr", "axum", "nonce", "islands", "tracing"]
rustdoc-args = ["--generate-link-to-definition", "--cfg", "erase_components"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(halyard_debuginfo)',
  'cfg(erase_components)',
] }
