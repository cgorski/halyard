[package]
name = "halyard"
version = "0.1.0"
publish = ["crates-io"]
authors = ["Greg Johnston"]
license = "MIT"
repository = "https://github.com/cgorski/halyard"
description = "Halyard is a full-stack, isomorphic Rust web framework leveraging fine-grained reactivity to build declarative user interfaces."
readme = "../README.md"
rust-version.workspace = true
edition.workspace = true

[dependencies]
halyard_throw_error = { workspace = true }
halyard_any_spawner = { workspace = true, features = [
  "wasm-bindgen",
  "futures-executor",
] }
base64 = { optional = true, workspace = true, default-features = true }
cfg-if = { workspace = true, default-features = true }
halyard_hydration_context = { workspace = true }
halyard_either_of = { workspace = true }
halyard_dom = { workspace = true }
halyard_macro = { workspace = true }
halyard_server = { workspace = true, features = ["tachys"] }
halyard_config = { workspace = true }
halyard_oco = { workspace = true }
halyard_or_poisoned = { workspace = true }
rand = { optional = true, workspace = true, default-features = true }
# NOTE: While not used directly, `getrandom`'s `wasm_js` feature is needed when `rand` is used on WASM to
#       avoid a compilation error
getrandom = { optional = true, workspace = true, default-features = true }
halyard_reactive_graph = { workspace = true, features = ["serde"] }
rustc-hash = { workspace = true, default-features = true }
halyard_tachys = { workspace = true, features = [
  "reactive_graph",
  "oco",
] }
thiserror = { workspace = true, default-features = true }
tracing = { optional = true, workspace = true, default-features = true }
typed-builder = { workspace = true, default-features = true }
typed-builder-macro = { workspace = true, default-features = true }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
halyard_server_fn = { workspace = true, features = ["form-redirects", "browser"] }
web-sys = { features = [
  "ShadowRoot",
  "ShadowRootInit",
  "ShadowRootMode",
], workspace = true, default-features = true }
wasm-bindgen = { workspace = true, default-features = true }
wasm-bindgen-futures = { workspace = true, default-features = true }
serde_qs = { workspace = true, default-features = true }
slotmap = { workspace = true, default-features = true }
futures = { workspace = true, default-features = true }
send_wrapper = { workspace = true, default-features = true }
wasm_split_helpers = { workspace = true, default-features = true }
subsecond = { workspace = true, default-features = true, optional = true }
dioxus-cli-config = { workspace = true, default-features = true, optional = true }
dioxus-devtools = { workspace = true, default-features = true, optional = true }

[features]
hydration = [
  "halyard_reactive_graph/hydration",
  "halyard_server/hydration",
  "halyard_hydration_context/browser",
  "halyard_dom/hydration",
]
csr = ["halyard_macro/csr", "halyard_reactive_graph/effects", "getrandom?/wasm_js"]
hydrate = [
  "halyard_macro/hydrate",
  "hydration",
  "halyard_tachys/hydrate",
  "halyard_reactive_graph/effects",
  "getrandom?/wasm_js",
]
default-tls = ["halyard_server_fn/default-tls"]
rustls = ["halyard_server_fn/rustls"]
ssr = [
  "halyard_macro/ssr",
  "halyard_server/ssr",
  "halyard_server_fn/ssr",
  "hydration",
  "halyard_tachys/ssr",
]
nightly = ["halyard_macro/nightly", "halyard_reactive_graph/nightly", "halyard_tachys/nightly"]
rkyv = ["halyard_server_fn/rkyv", "halyard_server/rkyv"]
bitcode = ["halyard_server_fn/bitcode"]
bitcode-serde = ["halyard_server_fn/bitcode-serde"]
serde-lite = ["halyard_server_fn/serde-lite", "halyard_server/serde-lite"]
cbor = ["halyard_server_fn/cbor"]
msgpack = ["halyard_server_fn/msgpack"]
postcard = ["halyard_server_fn/postcard"]
multipart = ["halyard_server_fn/multipart"]
tracing = [
  "dep:tracing",
  "halyard_reactive_graph/tracing",
  "halyard_tachys/tracing",
  "halyard_macro/tracing",
  "halyard_dom/tracing",
  "halyard_server/tracing",
]
nonce = ["base64", "rand", "dep:getrandom"]
islands = ["halyard_macro/islands"]
trace-component-props = [
  "halyard_macro/trace-component-props",
  "halyard_dom/trace-component-props",
]
delegation = ["halyard_tachys/delegation"]
islands-router = ["halyard_tachys/mark_branches"]
# Restores the upstream behaviour of panicking on a hydration mismatch (after logging),
# instead of logging once and falling back to client-side rendering.
panic-on-hydration-mismatch = ["halyard_tachys/panic-on-hydration-mismatch"]
subsecond = [
  "halyard_reactive_graph/subsecond",
  "dep:subsecond",
  "dep:dioxus-cli-config",
  "dep:dioxus-devtools",
  "web-sys/Location",
  "web-sys/MessageEvent",
  "web-sys/WebSocket",
  "web-sys/Window",
]

[dev-dependencies]
tokio = { features = [
  "rt-multi-thread",
  "macros",
], workspace = true, default-features = true }
tokio-test = { workspace = true, default-features = true }
halyard_any_spawner = { workspace = true, features = ["futures-executor", "tokio"] }
# for tests/render_mode.rs (dev-dependency cycles are allowed by cargo).
# Path only, no version: halyard_meta depends on this crate, so it is
# published later; cargo strips versionless dev-dependencies when publishing.
halyard_meta = { path = "../halyard_meta", features = ["ssr"] }

[build-dependencies]
rustc_version = { workspace = true, default-features = true }

# Having an erasure feature rather than normal --cfg erase_components for the proc macro crate is a workaround for this rust issue:
# https://github.com/rust-lang/cargo/issues/4423
# TLDR proc macros will ignore RUSTFLAGS when --target is specified on the cargo command.
# This works around the issue by the non proc-macro crate which does see RUSTFLAGS enabling the replacement feature on the proc-macro crate, which wouldn't.
# This is automatic as long as the halyard crate is depended upon,
# downstream usage should never manually enable this feature.
[target.'cfg(erase_components)'.dependencies]
halyard_macro = { workspace = true, features = ["__internal_erase_components"] }

[package.metadata.cargo-all-features]
denylist = [
  "tracing",
  "template_macro",
  "rustls",
  "default-tls",
  "wasm-bindgen",
  "rkyv",                  # was causing clippy issues on nightly
  "trace-component-props",
  "islands",
  "bitcode",
  "bitcode-serde",
  "serde-lite",
  "cbor",
  "msgpack",
  "postcard",
  "multipart",
]
skip_feature_sets = [
  [
    "csr",
    "ssr",
  ],
  [
    "csr",
    "hydrate",
  ],
  [
    "ssr",
    "hydrate",
  ],
  [
    "serde",
    "serde-lite",
  ],
  [
    "serde",
    "miniserde",
  ],
  [
    "serde",
    "rkyv",
  ],
  [
    "miniserde",
    "rkyv",
  ],
  [
    "serde-lite",
    "rkyv",
  ],
  [
    "default-tls",
    "rustls",
  ],
]
max_combination_size = 2

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition", "--cfg", "erase_components"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(halyard_debuginfo)',
  'cfg(rustc_nightly)',
  'cfg(erase_components)',
] }
