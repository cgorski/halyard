[package]
name = "halyard_reactive_stores"
version = "0.1.0"
publish = ["crates-io"]
authors = ["Greg Johnston"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/cgorski/halyard"
description = "Stores for holding deeply-nested reactive state while maintaining fine-grained reactive tracking."
rust-version.workspace = true
edition.workspace = true

[features]
default = []
serde = ["dep:serde"]
slotmap = ["dep:slotmap"]

[dependencies]
guardian = { workspace = true, default-features = true }
itertools = { workspace = true, default-features = true }
halyard_or_poisoned = { workspace = true }
pastey = { workspace = true, default-features = true }
halyard_reactive_graph = { workspace = true }
rustc-hash = { workspace = true, default-features = true }
halyard_reactive_stores_macro = { workspace = true }
send_wrapper = { workspace = true, default-features = true }
serde = { workspace = true, optional = true }
slotmap = { workspace = true, optional = true }
indexmap = { workspace = true, default-features = true }

[dev-dependencies]
tokio = { features = [
	"rt-multi-thread",
	"macros",
], workspace = true, default-features = true }
tokio-test = { workspace = true, default-features = true }
halyard_any_spawner = { workspace = true, features = ["futures-executor", "tokio"] }
halyard_reactive_graph = { workspace = true, features = ["effects"] }
halyard = { path = "../halyard", features = ["csr"], version = "0.1.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(halyard_debuginfo)'] }
