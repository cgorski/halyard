[workspace]
resolver = "2"
members = [
  # utilities
  "halyard_any_spawner",
  "halyard_const_str_slice_concat",
  "halyard_either_of",
  "halyard_next_tuple",
  "halyard_oco",
  "halyard_or_poisoned",

  # core
  "halyard_hydration_context",
  "halyard",
  "halyard_dom",
  "halyard_config",
  "halyard_macro",
  "halyard_macro_diagnostics",
  "halyard_server",
  "halyard_reactive_graph",
  "halyard_server_fn",
  "halyard_server_fn_macro",
  "halyard_server_fn/halyard_server_fn_macro_default",
  "halyard_tachys",

  # integrations
  "integrations/halyard_axum",
  "integrations/halyard_integration_utils",

  # vendored third-party crates (see third_party/*/Cargo.toml and NOTICE)
  "third_party/halyard_rstml",
  "third_party/halyard_syn_derive",

  # libraries
  "halyard_meta",
  "halyard_router",
  "halyard_router_macro",
  "halyard_throw_error",
]
exclude = ["examples"]

[workspace.package]
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
# members (directory names are kept from upstream to ease `git merge upstream/main`;
# the crate names are what matter)
halyard_throw_error = { path = "./halyard_throw_error/", version = "0.1.0" }
halyard_any_spawner = { path = "./halyard_any_spawner/", version = "0.1.0" }
halyard_const_str_slice_concat = { path = "./halyard_const_str_slice_concat", version = "0.1.0" }
halyard_either_of = { path = "./halyard_either_of/", version = "0.1.0" }
halyard_hydration_context = { path = "./halyard_hydration_context", version = "0.1.0" }
halyard = { path = "./halyard", version = "0.1.0" }
halyard_config = { path = "./halyard_config", version = "0.1.0" }
halyard_dom = { path = "./halyard_dom", version = "0.1.0" }
halyard_integration_utils = { path = "./integrations/halyard_integration_utils", version = "0.1.0" }
halyard_macro = { path = "./halyard_macro", version = "0.1.0" }
halyard_macro_diagnostics = { path = "./halyard_macro_diagnostics", version = "0.1.0" }
halyard_router = { path = "./halyard_router", version = "0.1.0" }
halyard_router_macro = { path = "./halyard_router_macro", version = "0.1.0" }
halyard_server = { path = "./halyard_server", version = "0.1.0" }
halyard_meta = { path = "./halyard_meta", version = "0.1.0" }
halyard_next_tuple = { path = "./halyard_next_tuple", version = "0.1.0" }
halyard_oco = { path = "./halyard_oco", version = "0.1.0" }
halyard_or_poisoned = { path = "./halyard_or_poisoned", version = "0.1.0" }
halyard_reactive_graph = { path = "./halyard_reactive_graph", version = "0.1.0" }
halyard_server_fn = { path = "./halyard_server_fn", version = "0.1.0" }
halyard_server_fn_macro = { path = "./halyard_server_fn_macro", version = "0.1.0" }
halyard_server_fn_macro_default = { path = "./halyard_server_fn/halyard_server_fn_macro_default", version = "0.1.0" }
halyard_tachys = { path = "./halyard_tachys", version = "0.1.0" }

# members deps
async-once-cell = { default-features = false, version = "0.5" }
itertools = { default-features = false, version = "0.14" }
convert_case = { default-features = false, version = "0.11" }
convert_case_extras = { default-features = false, version = "0.2" }
serde_json = { default-features = false, version = "1.0" }
