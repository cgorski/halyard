# Vendored copy of syn_derive 0.2.0 (https://github.com/Kyuuhachi/syn_derive,
# MIT OR Apache-2.0). Changes from upstream: the package is renamed so it
# cannot collide with crates.io, and the unmaintained `proc-macro-error2`
# dependency is replaced by a small `diagnostics` module (see `src/lib.rs`).
# See `Cargo.toml.upstream` for the original manifest.
[package]
name = "halyard_syn_derive"
version = "0.1.0"
publish = ["crates-io"]
edition = "2021"
authors = ["Kyuuhachi <caagr98@gmail.com>"]
description = "Derive macros for `syn::Parse` and `quote::ToTokens` (vendored syn_derive 0.2.0)"
repository = "https://github.com/cgorski/halyard"
homepage = "https://github.com/Kyuuhachi/syn_derive"
license = "MIT OR Apache-2.0"
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true
# upstream doctests refer to the crate as `syn_derive`, which is not this package's name
doctest = false

[dependencies]
syn = { workspace = true, default-features = true, features = ["parsing", "derive"] }
quote = { workspace = true, default-features = true }
proc-macro2 = { workspace = true, default-features = true }

[features]
full = ["syn/full"]
default = ["full"]

# vendored code: keep it close to upstream rather than chase lints
[lints.clippy]
all = "allow"
