############
# A make file for cargo-make (`cargo install --force cargo-make`).
#
# Upstream's per-example tasks were removed together with the examples; the
# member-crate tasks live in `cargo-make/*.toml` and are pulled in through
# CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE. The canonical check list is in
# `.github/workflows/ci.yml`.
############

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
