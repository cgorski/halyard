[package]
name = "halyard_router_macro"
version = "0.1.0"
publish = false
authors = ["Greg Johnston", "Ben Wishovich"]
license = "MIT"
readme = "../README.md"
repository = "https://github.com/cgorski/halyard"
description = "Router utility macros for the Halyard web framework."
rust-version.workspace = true
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true, default-features = true }
quote = { workspace = true, default-features = true }
syn = { features = ["full"], workspace = true, default-features = true }

[dev-dependencies]
halyard = { path = "../halyard" }
halyard_router = { path = "../halyard_router" }
halyard_macro = { path = "../halyard_macro" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(halyard_debuginfo)'] }
