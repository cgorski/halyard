[package]
name = "halyard_either_of"
version = "0.1.0"
publish = false
authors = ["Greg Johnston"]
license = "MIT"
readme = "../README.md"
repository = "https://github.com/cgorski/halyard"
description = "Utilities for working with enumerated types that contain one of 2..n other types."
rust-version.workspace = true
edition.workspace = true

[dependencies]
pin-project-lite = { workspace = true, default-features = true }
pastey = { workspace = true, default-features = true }

[features]
default = ["no_std"]
no_std = []
