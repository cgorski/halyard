[package]
name = "halyard_integration_utils"
authors = ["Greg Johnston"]
license = "MIT"
repository = "https://github.com/cgorski/halyard"
description = "Utilities to help build server integrations for the Halyard web framework."
version = "0.1.0"
publish = ["crates-io"]
rust-version.workspace = true
edition.workspace = true

[dependencies]
futures = { workspace = true, default-features = true }
halyard_hydration_context = { workspace = true }
halyard = { workspace = true, features = ["nonce"] }
halyard_meta = { workspace = true, features = ["ssr"] }
halyard_router = { workspace = true, features = ["ssr"] }
halyard_config = { workspace = true }
halyard_reactive_graph = { workspace = true, features = ["sandboxed-arenas"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]
