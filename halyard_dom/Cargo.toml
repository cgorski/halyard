[package]
name = "halyard_dom"
version = "0.1.0"
publish = ["crates-io"]
authors = ["Greg Johnston"]
license = "MIT"
repository = "https://github.com/cgorski/halyard"
description = "DOM operations for the Halyard web framework."
rust-version.workspace = true
edition.workspace = true

[dependencies]
halyard_tachys = { workspace = true }
halyard_reactive_graph = { workspace = true }
halyard_or_poisoned = { workspace = true }
js-sys = { workspace = true, default-features = true }
send_wrapper = { workspace = true, default-features = true }
tracing = { optional = true, workspace = true, default-features = true }
wasm-bindgen = { workspace = true, default-features = true }
serde_json = { optional = true, workspace = true, default-features = true }
serde = { optional = true, workspace = true, default-features = true }
thiserror = { workspace = true }

[dev-dependencies]
# Path only, no version: halyard depends on this crate, so it is published
# later; cargo strips versionless dev-dependencies when publishing.
halyard = { path = "../halyard" }

[dependencies.web-sys]
features = ["Location"]
workspace = true
default-features = true

[features]
default = []
tracing = ["dep:tracing"]
trace-component-props = ["dep:serde", "dep:serde_json"]
hydration = ["halyard_reactive_graph/hydration"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[package.metadata.cargo-all-features]
denylist = ["tracing"]
max_combination_size = 2

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(halyard_debuginfo)'] }
