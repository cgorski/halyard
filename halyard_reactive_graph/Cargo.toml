[package]
name = "halyard_reactive_graph"
version = "0.1.0"
publish = ["crates-io"]
authors = ["Greg Johnston"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/cgorski/halyard"
description = "A fine-grained reactive graph for building user interfaces, with the task executor, errors and server-to-client data sharing it builds on."
rust-version.workspace = true
edition.workspace = true

[dependencies]
futures = { workspace = true, default-features = true }
pin-project-lite = { workspace = true, default-features = true }
rustc-hash = { workspace = true, default-features = true }
serde = { features = [
  "derive",
], workspace = true, default-features = true }
slotmap = { workspace = true, default-features = true }
thiserror = { workspace = true, default-features = true }
tracing = { optional = true, workspace = true, default-features = true }
guardian = { workspace = true, default-features = true }
async-lock = { workspace = true, default-features = true }
send_wrapper = { features = [
  "futures",
], workspace = true, default-features = true }
indexmap = { workspace = true, default-features = true }
pastey = { workspace = true, default-features = true }
# the executor for the browser
wasm-bindgen-futures = { workspace = true, default-features = true }
# the browser's side of `hydration_context`
wasm-bindgen = { workspace = true, optional = true, default-features = true }
js-sys = { workspace = true, optional = true, default-features = true }

# the executor for the server
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { default-features = false, features = ["rt"], workspace = true }

# to log in the browser's console when `tracing` is off
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-sys = { workspace = true, features = ["console"] }

[dev-dependencies]
tokio = { features = [
  "rt-multi-thread",
  "macros",
  "time",
], workspace = true, default-features = true }
tokio-test = { workspace = true, default-features = true }
typed-builder.workspace = true
wasm-bindgen-test = { workspace = true, default-features = true }
anyhow.workspace = true

[features]
# serde impls for signals
serde = []
tracing = ["dep:tracing"]
# owners carry a `hydration_context::SharedContext`
hydration = []
# the browser's shared context (`hydration_context::HydrateSharedContext`)
browser = ["hydration", "dep:wasm-bindgen", "dep:js-sys"]
effects = [
] # whether to run effects: should be disabled for something like server rendering
sandboxed-arenas = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-all-features]
denylist = ["tracing"]
max_combination_size = 2

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(halyard_debuginfo)',
] }
