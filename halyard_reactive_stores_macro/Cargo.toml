[package]
name = "halyard_reactive_stores_macro"
version = "0.1.0"
publish = ["crates-io"]
authors = ["Greg Johnston"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/cgorski/halyard"
description = "Stores for holding deeply-nested reactive state while maintaining fine-grained reactive tracking."
rust-version.workspace = true
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
halyard_macro_diagnostics = { workspace = true }
convert_case = { workspace = true, default-features = true }
proc-macro2 = { workspace = true, default-features = true }
quote = { workspace = true, default-features = true }
syn = { features = ["full"], workspace = true, default-features = true }
