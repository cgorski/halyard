[package]
name = "halyard_macro_diagnostics"
version = "0.1.0"
publish = ["crates-io"]
license = "MIT"
repository = "https://github.com/cgorski/halyard"
description = "Minimal compile-error diagnostics for the halyard proc-macro crates (replaces proc-macro-error2)."
rust-version.workspace = true
edition.workspace = true

[dependencies]
proc-macro2 = { workspace = true, default-features = true }
quote = { workspace = true, default-features = true }
syn = { workspace = true, default-features = true }
