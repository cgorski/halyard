name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, clippy, tests, wasm check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # toolchain + targets come from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Library targets only, like upstream's `lint` task (test code carries a few
      # upstream-era lint hits); clippy lints stay at upstream's levels, which only
      # additionally deny `clippy::print_stdout`.
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings -D clippy::print_stdout

      # No panics, ever (README, "Project policy"): the count of panicking
      # constructs in library code may only fall. Lower it with --update.
      - name: panic ratchet
        run: scripts/panic-ratchet.sh

      # Tests run per crate: a single `cargo test --workspace` unifies features across
      # members and that makes some test targets fail (see the README's known issues).
      # halyard is tested in its three builds: default, `ssr`, and `axum` (the server
      # integration). The `axum` integration test (`tests/axum_integration.rs`) needs a
      # `cargo halyard build` of a fixture project, and the build tool is not available in
      # this repository's CI, so with `axum` every other test target runs here.
      - name: cargo test (per crate)
        run: |
          set -euo pipefail
          for pkg in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            echo "::group::cargo test -p $pkg"
            cargo test -p "$pkg"
            echo "::endgroup::"
          done
          echo "::group::cargo test -p halyard --features ssr"
          cargo test -p halyard --features ssr
          echo "::endgroup::"
          echo "::group::cargo test -p halyard --features axum (without the integration test)"
          cargo test -p halyard --features axum --lib
          cargo test -p halyard --features axum --doc
          for t in halyard/tests/*.rs; do
            name=$(basename "$t" .rs)
            [ "$name" = "axum_integration" ] || cargo test -p halyard --features axum --test "$name"
          done
          echo "::endgroup::"

      # Render-mode fingerprint: the same test must pass in both erasure modes.
      - name: render-mode parity test (typed)
        run: cargo test -p halyard --features ssr --test render_mode
      - name: render-mode parity test (erased)
        run: cargo test -p halyard --features ssr --test render_mode
        env:
          RUSTFLAGS: --cfg erase_components
          CARGO_TARGET_DIR: target/erased

      - name: wasm32 check (hydrate)
        run: cargo check -p halyard --no-default-features --features hydrate --target wasm32-unknown-unknown
      - name: wasm32 check (hydrate + nonce + islands + islands-router)
        run: cargo check -p halyard --no-default-features --features hydrate,nonce,islands,islands-router --target wasm32-unknown-unknown
      - name: ssr check (ssr; axum with tracing and nonce)
        run: |
          cargo check -p halyard --no-default-features --features ssr
          cargo check -p halyard --no-default-features --features axum,tracing,nonce
      # The views that render handles in every position (tests/handles_in_views.rs), built
      # for the browser: the server renders them in the tests, this checks they compile
      # with `hydrate`.
      - name: hydrate check of tests/handles_in_views.rs
        run: cargo check -p halyard --no-default-features --features hydrate --test handles_in_views

      # The example is outside the workspace (it has its own lockfile): check both of its
      # builds, the server (`ssr`) and the browser (`hydrate`, wasm32).
      - name: example ssr_modes_axum (ssr; hydrate on wasm32)
        run: |
          cargo check --manifest-path examples/ssr_modes_axum/Cargo.toml --features ssr
          cargo check --manifest-path examples/ssr_modes_axum/Cargo.toml --features hydrate --target wasm32-unknown-unknown

      - name: lockfile must not contain the replaced crates
        run: |
          ! grep -E '^name = "(paste|proc-macro-error2|proc-macro-error)"$' Cargo.lock
